<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">NTOPIA</title>
  <desc id="desc">A softly sculpted pale white N facing right at thirty degrees, floating in a rounded graphite space.</desc>
  <defs>
    <clipPath id="tile"><rect x="64" y="64" width="896" height="896" rx="208"/></clipPath>
    <linearGradient id="background" x1="160" y1="64" x2="864" y2="960" gradientUnits="userSpaceOnUse">
      <stop stop-color="#454B52"/><stop offset="1" stop-color="#22262C"/>
    </linearGradient>
    <linearGradient id="side" x1="300" y1="280" x2="760" y2="760" gradientUnits="userSpaceOnUse">
      <stop stop-color="#B6BFC7"/><stop offset=".5" stop-color="#87939E"/><stop offset="1" stop-color="#5E6A75"/>
    </linearGradient>
    <linearGradient id="face" x1="340" y1="260" x2="650" y2="760" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/><stop offset=".65" stop-color="#F3F4F2"/><stop offset="1" stop-color="#DDE2E4"/>
    </linearGradient>
    <g id="letter" transform="matrix(.866 .16 0 1 98 -82)">
      <path d="M 312 710 V 292 L 712 710 V 292" fill="none" stroke-width="116" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </defs>
  <g clip-path="url(#tile)">
    <rect x="64" y="64" width="896" height="896" fill="url(#background)"/>
    <g stroke="url(#side)">
      <use href="#letter" transform="translate(-60 22.0)"/>
      <use href="#letter" transform="translate(-57 20.9)"/>
      <use href="#letter" transform="translate(-54 19.8)"/>
      <use href="#letter" transform="translate(-51 18.7)"/>
      <use href="#letter" transform="translate(-48 17.6)"/>
      <use href="#letter" transform="translate(-45 16.5)"/>
      <use href="#letter" transform="translate(-42 15.4)"/>
      <use href="#letter" transform="translate(-39 14.3)"/>
      <use href="#letter" transform="translate(-36 13.2)"/>
      <use href="#letter" transform="translate(-33 12.1)"/>
      <use href="#letter" transform="translate(-30 11.0)"/>
      <use href="#letter" transform="translate(-27 9.9)"/>
      <use href="#letter" transform="translate(-24 8.8)"/>
      <use href="#letter" transform="translate(-21 7.7)"/>
      <use href="#letter" transform="translate(-18 6.6)"/>
      <use href="#letter" transform="translate(-15 5.5)"/>
      <use href="#letter" transform="translate(-12 4.4)"/>
      <use href="#letter" transform="translate(-9 3.3)"/>
      <use href="#letter" transform="translate(-6 2.2)"/>
      <use href="#letter" transform="translate(-3 1.1)"/>
    </g>
    <use href="#letter" stroke="url(#face)"/>
  </g>
  <rect x="66" y="66" width="892" height="892" rx="206" fill="none" stroke="#FFFFFF" stroke-opacity=".09" stroke-width="4"/>
</svg>
